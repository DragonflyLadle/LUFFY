name: Sync README TODO list

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-todos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Update TODO section
        run: python3 .github/scripts/update_todo_readme.py

      - name: Remove temporary automation files
        run: |
          rm -f .github/workflows/sync-readme-todo-list.yml
          rm -f .github/scripts/update_todo_readme.py

      - name: Commit and push README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No README TODO changes to commit."
          else
            git commit -m "docs: update complete TODO list after dev changes"
            git push origin HEAD:dev
          fi
